schema_version: 1

context:
  name: PyPDFForm
  version: "6.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/chinapandaman/PyPDFForm/archive/v${{ version }}.tar.gz
  sha256: 71101a7122c4e072724df18df012186d10646ac78f55930390c834c3fd63e6cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - fonttools >=4.63.0,<5.0.0
    - pikepdf >=10.7.2,<11.0.0
    - pillow >=12.2.0,<14.0.0
    - pypdf >=6.12.2,<7.0.0
    - cryptography >=50.0.0,<51.0.0
    - reportlab >=4.5.1,<6.0.0

tests:
  - python:
      imports:
        - PyPDFForm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The Python library for PDF forms.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/chinapandaman/PyPDFForm

extra:
  recipe-maintainers:
    - thewchan
