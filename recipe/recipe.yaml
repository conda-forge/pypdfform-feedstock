schema_version: 1

context:
  name: PyPDFForm
  version: "6.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/chinapandaman/PyPDFForm/archive/v${{ version }}.tar.gz
  sha256: 92a4eebe3907ab5ae22a03d0bcf03e3ca38934ceffc05685351b8a3244244beb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=84.2.1,<85.0.0
  run:
    - python >=${{ python_min }}
    - fonttools >=4.63.0,<5.0.0
    - pikepdf >=10.7.2,<11.0.0
    - pillow >=13.0.0,<14.0.0
    - pypdf >=6.19.0,<7.0.0
    - cryptography >=50.0.0,<51.0.0
    - reportlab >=4.5.1,<6.0.0

tests:
  - python:
      imports:
        - PyPDFForm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The Python library for PDF forms.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/chinapandaman/PyPDFForm

extra:
  recipe-maintainers:
    - thewchan
